      ],
      "dataState": "known"
    }
  ],
  "unknown": [{ "issueId": "TEAM-2", "code": "TASK_UNAVAILABLE", "detail": "<reason>" }]
}
```

Return every requested identifier either as one issue row or one scoped unknown. Sort all
