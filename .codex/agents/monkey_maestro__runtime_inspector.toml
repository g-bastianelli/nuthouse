{
  "schemaVersion": 1,
  "provider": "ready | partial | unavailable",
  "context": {
    "targetHostId": "<exact input host>",
    "supersetProjectId": "<exact input Superset project>",
    "linearProjectId": "<exact input Linear project>"
  },
  "scope": { "selectedIssueIds": ["TEAM-1"] },
  "issues": [
