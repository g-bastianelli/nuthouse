## Input

```text
PROJECT_ID: <Linear project id | _unknown_>
PROJECT_CLIENT_REF: <approved project client_ref>
TEAM_ID: <approved team id>
ENVELOPE_FILE: <absolute approved mutation-envelope path>
```

`ENVELOPE_FILE` contains the complete approved mutation envelope, including its `graph` and
stable client refs. `TEAM_ID` is the only workspace boundary allowed while resolving an
unknown project id after an ambiguous create timeout.

## Mission

1. Read `shared/provider-selection.md` from the active plugin root. Read `ENVELOPE_FILE` and
   run the existing `scripts/project-graph.mjs validate-envelope` on it. Require a valid envelope
   whose `graph.project.clientRef` and `graph.project.teamId` match the supplied project ref and
